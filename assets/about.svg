<rect width="900" height="392" rx="18" fill="url(#bg)"/><rect x=".5" y=".5" width="899" height="391" rx="18" fill="none" stroke="#2F2160"/><text x="36" y="48" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" fill="#C4B5FD" text-anchor="start" letter-spacing="3">SUMMARY</text><text x="36" y="78" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#EDE9FE" text-anchor="start" >I build and ship mobile games end to end: gameplay systems,</text><text x="36" y="102" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#EDE9FE" text-anchor="start" >in-game UI, performance tuning, store release, and</text><text x="36" y="126" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#EDE9FE" text-anchor="start" >post-launch iteration. My work spans 2D and 3D Unity in C#,</text><text x="36" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#EDE9FE" text-anchor="start" >including on-device AI like Whisper.cpp speech recognition</text><text x="36" y="174" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#EDE9FE" text-anchor="start" >inside a shipped children&#x27;s game. Beyond the engine I work</text><text x="36" y="198" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#EDE9FE" text-anchor="start" >with Flutter, React, Node.js, Supabase and Firebase, and I</text><text x="36" y="222" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#EDE9FE" text-anchor="start" >let tester feedback decide what gets built next.</text><rect x="592" y="28" width="276" height="336" rx="14" fill="#1B1038" stroke="#2F2160"/><text x="614" y="64" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#C4B5FD" text-anchor="start" letter-spacing="2">ROLE</text><text x="614" y="84" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#EDE9FE" text-anchor="start" >Unity Game Developer</text><text x="614" y="118" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#C4B5FD" text-anchor="start" letter-spacing="2">EXPERIENCE</text><text x="614" y="138" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#EDE9FE" text-anchor="start" >2+ years, 2D and 3D</text><text x="614" y="172" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#C4B5FD" text-anchor="start" letter-spacing="2">EDUCATION</text><text x="614" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#EDE9FE" text-anchor="start" >MCA, Game Development</text><text x="614" y="213" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#EDE9FE" text-anchor="start" >Jain Online, Bengaluru</text><text x="614" y="247" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#C4B5FD" text-anchor="start" letter-spacing="2">BASED IN</text><text x="614" y="267" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#EDE9FE" text-anchor="start" >Tamil Nadu, India</text><text x="614" y="301" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#C4B5FD" text-anchor="start" letter-spacing="2">OPEN TO</text><text x="614" y="321" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#EDE9FE" text-anchor="start" >Full-time roles</text><text x="614" y="342" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#EDE9FE" text-anchor="start" >Part-time collaborations</text>
</svg>
