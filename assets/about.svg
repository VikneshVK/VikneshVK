<svg xmlns="http://www.w3.org/2000/svg" width="900" height="392" viewBox="0 0 900 392" role="img" aria-label="About Viknesh: Unity game developer with 2+ years of experience, MCA in Game Development, open to full-time roles and collaborations.">
<title>About Viknesh: Unity game developer with 2+ years of experience, MCA in Game Development, open to full-time roles and collaborations.</title>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#6366F1"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
