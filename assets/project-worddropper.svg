<svg xmlns="http://www.w3.org/2000/svg" width="900" height="212" viewBox="0 0 900 212" role="img" aria-label="Word Dropper: A word-survival game where every letter on screen runs its own ticking clock, and finding a word is the only way to buy more time.">
<title>Word Dropper: A word-survival game where every letter on screen runs its own ticking clock, and finding a word is the only way to buy more time.</title>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#6366F1"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
